preview_urls = false

[vars]
# Public identifier of the "Sign in with Google" button (Google Cloud Console). Not a secret.
# The same client ID as the group sign-up and attendance tools.
GOOGLE_CLIENT_ID = "308086551990-5bad5hnam1k2d3l6br1kphht2eov0l2n.apps.googleusercontent.com"

# The instructor emails and the session key are secrets, not here:
#   npx wrangler secret put ADMIN_EMAILS
#   npx wrangler secret put SESSION_SECRET

[[d1_databases]]
binding = "DB"
database_name = "competency-survey"
database_id = "3867303d-46da-43eb-b12c-5ba3015201e4"
