<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career skills self-assessment</title>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="config.js"></script>
  <style>
    :root { --ink: #1f2328; --muted: #5c6670; --line: #d8dde3; --bg: #f6f7f9; --card: #fff;
            --accent: #0b5cad; --ok: #1a7f37; --warn: #b3261e; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 16px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 20px 16px 120px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    h2 { font-size: 20px; margin: 0 0 4px; }
    h3 { font-size: 16px; margin: 18px 0 8px; }
    p { margin: 0 0 10px; }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-top: 16px; }
    .banner { padding: 10px 14px; border-radius: 8px; margin-top: 12px; }
    .banner.err { background: #fdecea; color: var(--warn); border: 1px solid #f3c1bc; }
    .banner.ok { background: #e8f5ec; color: var(--ok); border: 1px solid #b9dfc4; }
    .banner.note { background: #eef4fb; color: var(--ink); border: 1px solid #c9dbf0; }
    .standby { padding: 22px 16px; border-radius: 12px; background: #f0f2f5; color: var(--muted); text-align: center; font-size: 18px; margin-top: 16px; }
    .code { display: block; width: 180px; margin: 0 auto 14px; padding: 10px; font-size: 32px; letter-spacing: 10px; text-align: center;
            border: 2px solid var(--line); border-radius: 10px; font-family: inherit; }
    .codelabel { text-align: center; margin-bottom: 12px; }
    .item { padding-top: 2px; scroll-margin-top: 16px; }
    .item.missing .stmt { color: var(--warn); }
    .item.missing .big { border-color: #f3c1bc; }
    /* the statement, then five big rounded buttons with the scale words inside */
    .stmt { font-size: 17px; font-weight: 600; margin: 16px 0 8px; }
    .scale { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
    .scale .btns { flex: 1 1 340px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .card > h2.ask { font-weight: 400; }
    .card > h2.ask b { font-weight: 700; }
    .big { padding: 14px 4px; border-radius: 14px; border: 2px solid var(--line); background: #fff; color: var(--ink); font: inherit;
           font-size: 15px; font-weight: 600; line-height: 1.2; text-align: center; cursor: pointer; box-shadow: 0 1px 2px rgba(0, 0, 0, .06);
           transition: transform .08s, background .12s, border-color .12s; }
    .big:hover { border-color: #a9b8c8; transform: translateY(-1px); }
    .big:active { transform: translateY(0); }
    .big.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 6px rgba(11, 92, 173, .35); }
    /* a question with the sixth option ("No chance to try"): six buttons, the sixth gray and dashed, off the scale */
    .scale .btns.six { grid-template-columns: repeat(6, 1fr); }
    .big.na { background: #f0f2f5; border-style: dashed; color: var(--muted); font-weight: 500; }
    .big.na.on { background: #5c6670; border-color: #5c6670; border-style: solid; color: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
    @media (max-width: 480px) {
      .scale .btns, .scale .btns.six { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }
      .big { font-size: 14px; padding: 12px 4px; }
    }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -2px 10px rgba(0, 0, 0, .08); }
    .bar div.in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .bar .state { color: var(--muted); font-size: 14px; flex: 1; }
    /* competency cards alternate light tan and light gray; the answer buttons stay white (blue when chosen) */
    .card.compA { background: #f6efe6; border-color: #e2d3bf; }
    .card.compB { background: #eceef1; border-color: #d3d8de; }
    /* the competency's name is a full-width banner across the top of its card: white on very dark brown or near black */
    .card.compA > h2, .card.compB > h2 { margin: -16px -16px 12px; padding: 12px 16px; border-radius: 7px 7px 0 0; color: #fff; }
    .card.compA > h2 { background: #4a3322; }
    .card.compB > h2 { background: #1f2328; }
    /* one circle per item: blue when answered, red when missing after Submit; a click scrolls to the item */
    .dots { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
    .dot { position: relative; width: 11px; height: 11px; padding: 0; border-radius: 50%; border: 1.5px solid #9aa7b4; background: #fff; cursor: pointer; }
    .dot::after { content: ''; position: absolute; inset: -3px; }
    .dot.first { margin-left: 4px; }
    .dot.first:first-child { margin-left: 0; }
    .dot.on { background: var(--accent); border-color: var(--accent); }
    .dot.miss { background: var(--warn); border-color: var(--warn); }
    button.go { font: inherit; font-weight: 700; padding: 10px 20px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    button.go:disabled { opacity: .5; cursor: default; }
    button.link { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; font: inherit; cursor: pointer; }
    button.pick { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent); background: #fff; color: var(--accent); cursor: pointer; margin: 6px 6px 0 0; }
    ul.status { margin: 8px 0 0; padding-left: 20px; }
    ul.status button.link { margin-left: 6px; }
    #signin { margin-top: 16px; }

    /* ---- the results page after Submit: each competency's score on a 1-to-5 track, then the goals card */
    .card > p.lead { margin: 0 0 6px; }
    .rows { margin-top: 18px; }
    .srow { display: grid; grid-template-columns: 170px 1fr; align-items: center; gap: 6px 18px; padding: 14px 0 22px; }
    .srow + .srow { border-top: 1px solid rgba(0, 0, 0, .07); }
    .srow .lab { font-weight: 700; line-height: 1.25; }
    .srow .lab .sub { display: block; font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 2px; }
    .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; padding: 2px 7px; border-radius: 10px;
           background: #4a3322; color: #fff; margin-left: 6px; vertical-align: 2px; }
    .tag.prev { background: #fff; color: #4a3322; border: 1px solid #4a3322; }
    /* the track: a bar from 1 to 5 with a tick and a label at each level; the marker slides to the score */
    .track { position: relative; height: 10px; margin: 14px 18px 20px; border-radius: 5px; background: linear-gradient(90deg, #e3ddd3, #cfdceb); }
    .tick { position: absolute; top: -4px; width: 2px; height: 18px; margin-left: -1px; background: rgba(31, 35, 40, .22); border-radius: 1px; }
    .tlab { position: absolute; top: 18px; transform: translateX(-50%); font-size: 12px; color: var(--muted); white-space: nowrap; }
    .mark { position: absolute; top: 50%; left: 0; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; background: var(--accent); color: #fff;
            font-weight: 700; font-size: 14px; line-height: 38px; text-align: center; box-shadow: 0 3px 10px rgba(11, 92, 173, .4); border: 2px solid #fff;
            transition: left .9s cubic-bezier(.2, .8, .2, 1); z-index: 2; }
    .mark.prev { width: 16px; height: 16px; margin: -8px 0 0 -8px; background: #fff; border: 2.5px solid #4a3322; box-shadow: none; z-index: 1; }
    .span { position: absolute; top: 50%; height: 4px; margin-top: -2px; background: #4a3322; opacity: .45; border-radius: 2px; transition: left .9s cubic-bezier(.2, .8, .2, 1), width .9s cubic-bezier(.2, .8, .2, 1); }
    .track .none { position: absolute; left: 0; top: -9px; font-size: 14px; color: var(--muted); font-style: italic; background: rgba(255, 255, 255, .7); padding: 3px 8px; border-radius: 6px; }
    .legend { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin: 0 4px 0 10px; }
    .legend i.now { background: var(--accent); }
    .legend i.was { background: #fff; border: 2px solid #4a3322; width: 9px; height: 9px; }
    @media (max-width: 560px) {
      .srow { grid-template-columns: 1fr; gap: 2px; padding: 12px 0 20px; }
      .tlab.mid { display: none; }
    }
    /* the goals card appears after the scores have settled */
    .card.goals { opacity: 0; transform: translateY(14px); transition: opacity .7s ease, transform .7s ease; }
    .card.goals.show { opacity: 1; transform: none; }
    .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-top: 14px; }
    .chip { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: var(--ink);
            font: inherit; font-weight: 600; text-align: left; cursor: pointer; transition: transform .08s, background .12s, border-color .12s; }
    .chip:hover { border-color: #a9b8c8; transform: translateY(-1px); }
    .chip .n { flex: 1; }
    .chip .sc { font-size: 13px; font-weight: 600; color: var(--muted); background: #f0f2f5; padding: 2px 8px; border-radius: 10px; }
    .chip .ck { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; text-align: center; line-height: 18px; font-size: 14px; color: transparent; }
    .chip.on { background: #4a3322; border-color: #4a3322; color: #fff; }
    .chip.on .sc { background: rgba(255, 255, 255, .18); color: #fff; }
    .chip.on .ck { background: #fff; border-color: #fff; color: #4a3322; }
    .chip:disabled { opacity: .45; cursor: default; transform: none; }
    .goalrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 16px; }
    .goalrow .count { color: var(--muted); flex: 1; }
    button.go.brown { background: #4a3322; }
    .goal { margin-top: 14px; padding: 2px 0 2px 14px; border-left: 4px solid #4a3322; }
    .goal h3 { margin: 0; font-size: 17px; }
    .goal .why { margin: 6px 0 0; color: var(--muted); }
    .tip { margin-top: 10px; }
    .tip .stmt { margin: 0; }
    .tip .adv { margin: 4px 0 0; white-space: pre-line; }
    .after { margin-top: 18px; }
  </style>
</head>
<body>
<main>
  <div id="app"><p class="muted">Loading...</p></div>
  <div id="signin" hidden></div>
</main>
<div id="bar" class="bar" hidden></div>
<script>
  // The class is chosen by the link (?c=key).
  var API = (window.SURVEY_API || '').replace(/\/+$/, '');
  var classKey = new URLSearchParams(location.search).get('c') || '';
  var TOKEN_KEY = 'survey_token';
  var TZ = 'America/New_York';
  var conf = null, token = '', S = null, flash = '', timer = null;
  var roundId = '';         // the round being answered
  var draft = {};           // its answers as the student picks them: {itemId: 1..5, or 'na' (the sixth option)}
  var saving = false, dirty = false, saveTimer = null, savedAt = '', saveError = '', showMissing = false, done = '';
  var view = '';            // '' = the survey form; 'results' = the results page of a submitted round (scores and goals)
  var goalDraft = null;     // the sections being chosen as goals on the results page (null: not editing)
  var goalsBusy = false, goalsNote = '', goalsSkipped = false, revealTimer = null;
  var animateResults = true;  // the markers slide to the scores the first time the results page is drawn
  // The token is kept in localStorage: the Worker's session token (sent after a Google sign-in) lasts months. "Sign out" deletes it.
  try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
  tokenFromHash();

  function el(tag, attrs) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { e.addEventListener(ev, attrs.on[ev]); });
      else if (attrs[k] !== false && attrs[k] !== null) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid === null || kid === undefined || kid === false) continue;
      e.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    }
    return e;
  }

  function setToken(t) {
    token = t || '';
    try { token ? localStorage.setItem(TOKEN_KEY, token) : localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }

  function api(action, args) {
    return fetch(API + '/survey', { method: 'POST', body: JSON.stringify({ token: token, class: classKey, action: action, args: args || [] }) })
      .then(function (r) { return r.json(); })
      .then(function (out) {
        if (out.session) setToken(out.session);
        if (out.ok) return out.state;
        if (out.error === 'SIGNIN') { setToken(''); S = null; showSignIn(); throw new Error('SIGNIN'); }
        throw new Error(out.error);
      });
  }

  function when(iso) {
    return new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(new Date(iso));
  }
  function clockOf(iso) { return new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).format(new Date(iso)).toLowerCase(); }
  function cur() { return S && S.rounds.filter(function (r) { return r.id === roundId; })[0]; }
  function items() {
    var out = [];
    S.blocks.forEach(function (b) { b.items.forEach(function (i) { out.push(i); }); });
    return out;
  }
  // an answer counts when it is a level, or the sixth option of a question that offers it
  function has(i) { return i.id in draft && (draft[i.id] !== 'na' || i.na); }
  function answered() { return items().filter(has).length; }

  /** Loads the state. A survey being answered is left as it is; only the round list and status are refreshed. */
  function load() {
    if (!token) return;
    api('state').then(function (s) {
      var before = cur();
      S = s; flash = '';
      var r = cur();
      // The round in progress keeps the student's picks; otherwise the round shown is the open one not yet submitted.
      if (!(r && r.open && before)) {
        var open = S.rounds.filter(function (x) { return x.open; });
        var pick = open.filter(function (x) { return !x.submitted; })[0] || open[0] || null;
        roundId = pick ? pick.id : '';
        draft = pick ? Object.assign({}, pick.answers) : {};
        savedAt = pick ? pick.saved : '';
        // a submitted survey opens on its results page
        view = pick && pick.submitted ? 'results' : ''; goalDraft = null; goalsNote = ''; animateResults = true;
      }
      render(); schedule();
    }).catch(function (e) { if (e.message !== 'SIGNIN') { flash = 'The page could not load. ' + e.message; render(); } });
  }

  // While no survey is open the page checks every minute, so it shows the survey once the instructor opens it.
  function schedule() {
    clearTimeout(timer);
    if (S && S.authorized && !(cur() && cur().open)) timer = setTimeout(function () { if (!document.hidden) load(); else schedule(); }, 60000);
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !(cur() && cur().open)) load(); });

  // ---------------------------------------------------------------- answering

  function choose(id, value) {
    draft[id] = value;
    done = '';
    var item = document.getElementById('item-' + id);
    if (item) {
      Array.prototype.forEach.call(item.querySelectorAll('[data-v]'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === String(value)); });
      item.classList.remove('missing');
    }
    var r = cur();
    if (r && !r.submitted) { dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(save, 1200); }
    else dirty = true;
    renderBar();
  }

  /** Saves the draft (before the first submission). */
  function save() {
    var r = cur();
    if (!r || r.submitted || saving || !dirty) return;
    saving = true; dirty = false; saveError = ''; renderBar();
    api('save', [r.id, draft]).then(function (s) {
      saving = false; S = s; savedAt = cur() ? cur().saved : '';
      renderBar();
      if (dirty) save();
    }).catch(function (e) {
      saving = false; dirty = true;
      if (e.message === 'SIGNIN') return;
      saveError = e.message; renderBar();
      if (/closed/.test(e.message)) load();
    });
  }

  function submit() {
    var r = cur();
    var missing = items().filter(function (i) { return !has(i); });
    if (missing.length) {
      showMissing = true;
      missing.forEach(function (i) { var e = document.getElementById('item-' + i.id); if (e) e.classList.add('missing'); });
      var first = document.getElementById('item-' + missing[0].id);
      if (first) first.scrollIntoView({ behavior: 'smooth' });
      renderBar();
      return;
    }
    clearTimeout(saveTimer);
    saving = true; saveError = ''; renderBar();
    var again = !!r.submitted;
    api('submit', [r.id, draft]).then(function (s) {
      saving = false; dirty = false; S = s; showMissing = false;
      savedAt = cur().saved;
      done = again ? 'Your changes are submitted.' : 'Thank you. Your answers are submitted.';
      view = 'results'; goalDraft = null; goalsNote = ''; goalsSkipped = false; animateResults = true;
      render();
      window.scrollTo(0, 0);
    }).catch(function (e) {
      saving = false;
      if (e.message === 'SIGNIN') return;
      saveError = e.message; renderBar();
      if (/closed/.test(e.message)) load();
    });
  }

  window.addEventListener('beforeunload', function (ev) {
    if (dirty || saving) { ev.preventDefault(); ev.returnValue = ''; }
  });

  // ---------------------------------------------------------------- sign-in

  function whenGoogleReady(fn) {
    if (window.google && google.accounts && google.accounts.id) fn();
    else setTimeout(function () { whenGoogleReady(fn); }, 100);
  }

  function showSignIn() {
    var app = document.getElementById('app');
    var box = document.getElementById('signin');
    document.getElementById('bar').hidden = true;
    app.innerHTML = '';
    app.appendChild(el('h1', { text: conf.title }));
    app.appendChild(el('p', { class: 'muted', text: 'Sign in with the Google account of the email address your instructor has on file (your university account, not a personal Gmail). You sign in once; this browser stays signed in afterwards.' }));
    box.hidden = false;
    box.innerHTML = '';
    whenGoogleReady(function () { google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', text: 'signin_with' }); });
    box.appendChild(el('p', { class: 'muted', style: 'margin-top:14px' }, 'Signed in to a personal account on this phone or computer? ',
      el('button', { class: 'link', text: 'Choose or add the university account', on: { click: chooseAccount } }), '.'));
  }

  /**
   * Google's account chooser in this tab, for a browser whose only Google account is the wrong one: the
   * "Sign in with Google" button then signs in with that account without asking. Google returns to this
   * page with the ID token in the URL fragment (tokenFromHash); the page's address must be registered as
   * an authorized redirect URI of the client ID.
   */
  function chooseAccount() {
    var nonce = Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { sessionStorage.setItem('signin_nonce', nonce); } catch (e) {}
    location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + new URLSearchParams({
      client_id: conf.clientId, redirect_uri: location.origin + location.pathname, response_type: 'id_token',
      scope: 'openid email', nonce: nonce, prompt: 'select_account', state: classKey }).toString();
  }

  function tokenFromHash() {
    var h = new URLSearchParams(location.hash.replace(/^#/, ''));
    var t = h.get('id_token');
    if (!t) return;
    var nonce = '';
    try { nonce = sessionStorage.getItem('signin_nonce') || ''; sessionStorage.removeItem('signin_nonce'); } catch (e) {}
    var p = {};
    try { var b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); p = JSON.parse(atob(b + '==='.slice(0, (4 - b.length % 4) % 4))); } catch (e) {}
    if (!classKey) classKey = h.get('state') || '';
    if (nonce && p.nonce === nonce) setToken(t);
    history.replaceState(null, '', location.pathname + (classKey ? '?c=' + encodeURIComponent(classKey) : ''));
  }

  function signOut() {
    if ((dirty || saving) && !confirm('Your last answers are not saved yet. Sign out anyway?')) return;
    setToken(''); S = null; clearTimeout(timer); clearTimeout(saveTimer); dirty = false;
    whenGoogleReady(function () { google.accounts.id.disableAutoSelect(); });
    showSignIn();
  }

  function boot() {
    var app = document.getElementById('app');
    fetch(API + '/config').then(function (r) { return r.json(); }).then(function (c) {
      conf = c;
      var chosen = c.classes.filter(function (x) { return x.key === classKey; })[0] ||
                   (!classKey && c.classes.length === 1 ? c.classes[0] : null);
      if (!chosen) {
        app.innerHTML = '';
        app.appendChild(el('h1', { text: 'Career skills self-assessment' }));
        if (classKey) app.appendChild(el('div', { class: 'banner err', text: 'This link does not match any class. Check the link your instructor posted.' }));
        else if (!c.classes.length) app.appendChild(el('div', { class: 'banner err', text: 'No class is configured yet.' }));
        else app.appendChild(el('p', { text: 'Choose your class:' }));
        var list = el('ul');
        if (!classKey) c.classes.forEach(function (x) {
          list.appendChild(el('li', {}, el('a', { href: '?c=' + encodeURIComponent(x.key), text: x.title || x.key })));
        });
        app.appendChild(list);
        return;
      }
      classKey = chosen.key;
      conf.title = chosen.title;
      document.title = conf.title + ': self-assessment';
      whenGoogleReady(function () {
        google.accounts.id.initialize({
          client_id: conf.clientId,
          callback: function (resp) { setToken(resp.credential); document.getElementById('signin').hidden = true; load(); }
        });
      });
      if (token) load(); else showSignIn();
    }).catch(function () {
      app.innerHTML = '';
      app.appendChild(el('div', { class: 'banner err', text: 'The survey service did not respond. Reload the page in a minute.' }));
    });
  }

  // ---------------------------------------------------------------- rendering

  function render() {
    var app = document.getElementById('app');
    var bar = document.getElementById('bar');
    app.innerHTML = '';
    if (!S) { bar.hidden = true; app.appendChild(el('p', { class: flash ? 'banner err' : 'muted', text: flash || 'Loading...' })); return; }
    document.getElementById('signin').hidden = true;
    var signOutLink = el('button', { class: 'link', text: 'Sign out', on: { click: signOut } });
    app.appendChild(el('h1', { text: S.title }));
    if (!S.authorized && S.instructor) {
      bar.hidden = true;
      app.appendChild(el('p', {}, 'This is the student page, and ' + S.email + ' is an instructor account. ',
        el('a', { href: 'survey_admin.html' + location.search, text: 'Open the instructor page' }), '. ', signOutLink));
      return;
    }
    if (!S.authorized) {
      bar.hidden = true;
      app.appendChild(el('div', { class: 'banner err',
        text: 'The account ' + S.email + ' is not on the class roster. Sign in with the account of the email address your instructor has on file, or contact your instructor.' }));
      app.appendChild(el('p', {}, signOutLink));
      return;
    }
    app.appendChild(el('p', { class: 'muted' }, S.name + ' (' + S.email + '). ', signOutLink));
    if (flash) app.appendChild(el('div', { class: 'banner err', text: flash }));

    var r = cur();
    var open = S.rounds.filter(function (x) { return x.open; });
    clearTimeout(revealTimer);
    // the results page of a submitted survey (open or closed): the scores, then the goals
    if (view === 'results' && r && r.submitted) {
      bar.hidden = true;
      if (done) app.appendChild(el('div', { class: 'banner ok', text: done }));
      app.appendChild(resultsView(r));
      return;
    }
    if (!r || !r.open) {
      bar.hidden = true;
      app.appendChild(el('div', { class: 'standby', text: 'No survey is open right now. Your instructor will tell you when it opens.' }));
      app.appendChild(statusList());
      return;
    }
    if (open.length > 1) {
      var picks = el('p', {}, 'Two surveys are open. You are answering: ' + r.name + '. ');
      open.forEach(function (x) {
        if (x.id !== r.id) picks.appendChild(el('button', { class: 'pick', text: 'Switch to ' + x.name, on: { click: function () {
          if (dirty) save();
          roundId = x.id; draft = Object.assign({}, x.answers); savedAt = x.saved; done = ''; showMissing = false;
          view = x.submitted ? 'results' : ''; goalDraft = null; goalsNote = ''; animateResults = true; render();
        } } }));
      });
      app.appendChild(picks);
    }
    app.appendChild(el('h2', { style: 'margin-top:14px', text: S.heading + ': ' + r.name.toLowerCase() }));
    if (done) app.appendChild(el('div', { class: 'banner ok', text: done }));
    if (r.submitted) app.appendChild(el('p', {}, el('button', { class: 'link', text: 'Back to my results', on: { click: function () {
      if (dirty && !confirm('Your changed answers are not submitted yet. Leave them?')) return;
      dirty = false; draft = Object.assign({}, r.answers); view = 'results'; animateResults = true; render(); window.scrollTo(0, 0);
    } } })));
    if (S.needCode && !r.started) {
      bar.hidden = true;
      app.appendChild(codeCard(r));
      return;
    }
    var finish = 'Your answers are saved as you go, so you can finish later. Submit once every item has an answer' + (r.closes ? ' (by ' + when(r.closes) + ').' : '.');
    if (r.submitted) {
      app.appendChild(el('div', { class: 'banner note', text: 'You submitted this survey on ' + when(r.submitted) + '. You can change answers and submit again'
        + (r.closes ? ' until ' + when(r.closes) + '.' : ' while the survey is open.') }));
    } else {
      // the round's opening text, the instruction sentence, then how saving works
      if (r.intro) app.appendChild(el('p', { text: r.intro }));
      app.appendChild(el('p', { text: S.instruction + ' ' + finish }));
    }

    S.blocks.forEach(function (c, ci) {
      // the heading is the block's name in bold, then the rating instruction in normal weight
      var head = el('h2', { class: 'ask' }, el('b', { text: c.name }), S.prompt ? ': ' + S.prompt : null);
      var card = el('div', { class: 'card ' + (ci % 2 ? 'compB' : 'compA') }, head);
      c.items.forEach(function (d) {
        var id = d.id;
        var box = el('div', { class: 'item' + (showMissing && !has(d) ? ' missing' : ''), id: 'item-' + id });
        // the statement, then five big buttons with the scale words inside, and the sixth option when the question offers it
        box.appendChild(el('p', { class: 'stmt', text: d.text }));
        var btns = el('div', { class: 'btns' + (d.na ? ' six' : ''), role: 'group', 'aria-label': c.name + (S.prompt ? ': ' + S.prompt : '') });
        S.levels.forEach(function (t, k) { btns.appendChild(bigOption(id, k + 1, t)); });
        if (d.na) btns.appendChild(bigOption(id, 'na', S.naLabel, 'na'));
        box.appendChild(el('div', { class: 'scale' }, btns));
        card.appendChild(box);
      });
      app.appendChild(card);
    });
    renderBar();
  }

  /** One big button with the scale word inside (extra: a further class, 'na' for the sixth option). */
  function bigOption(id, value, label, extra) {
    return el('button', { type: 'button', class: 'big' + (extra ? ' ' + extra : '') + (String(draft[id]) === String(value) ? ' on' : ''), 'data-v': String(value), text: label,
                          on: { click: function () { choose(id, value); } } });
  }

  /** Before a round is started: the session code shown on the instructor's screen (it changes every S.codeSec seconds). */
  function codeCard(r) {
    var msg = el('div', { class: 'banner err', hidden: true });
    var input = el('input', { class: 'code', inputmode: 'numeric', autocomplete: 'off', maxlength: '4', 'aria-label': 'Session code' });
    var go = el('button', { class: 'go', text: 'Start' });
    function start() {
      var code = input.value.replace(/\D/g, '');
      if (code.length !== 4) { msg.textContent = 'Type the 4 digits shown on the screen.'; msg.hidden = false; return; }
      go.disabled = true; msg.hidden = true;
      api('unlock', [r.id, code]).then(function (s) {
        S = s; var x = cur();
        draft = Object.assign({}, x.answers); savedAt = x.saved; dirty = false; done = '';
        render(); window.scrollTo(0, 0);
      }).catch(function (e) {
        go.disabled = false;
        if (e.message === 'SIGNIN') return;
        msg.textContent = e.message; msg.hidden = false;
        if (/closed/.test(e.message)) load();
        input.select();
      });
    }
    go.addEventListener('click', start);
    input.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') start(); });
    setTimeout(function () { input.focus(); }, 0);
    return el('div', { class: 'card', style: 'text-align:center' },
      el('p', { class: 'codelabel', text: 'Type the session code shown on the screen. It changes every ' + (S.codeSec || 30) + ' seconds.' }), input, go, msg);
  }

  function statusList() {
    var ul = el('ul', { class: 'status' });
    S.rounds.forEach(function (x) {
      ul.appendChild(el('li', { text: x.name + ': ' + (x.submitted ? 'submitted ' + when(x.submitted) + '.' : x.saved ? 'started, not submitted' : 'not taken') },
        x.submitted ? el('button', { class: 'link', text: 'See my results', on: { click: function () {
          roundId = x.id; draft = Object.assign({}, x.answers); savedAt = x.saved; done = ''; view = 'results'; goalDraft = null; goalsNote = ''; animateResults = true; render(); window.scrollTo(0, 0);
        } } }) : null));
    });
    return el('div', { class: 'card' }, el('b', { text: 'Your surveys' }), ul);
  }

  // ---------------------------------------------------------------- the results page

  function f1(v) { return v === null || v === undefined ? '' : (Math.round(v * 10) / 10).toFixed(1); }
  function pos(v) { return ((v - 1) / (S.levels.length - 1) * 100) + '%'; }

  /**
   * The results page of a submitted round: a card with the student's score in each section on a track from 1 to 5
   * (the end-of-semester page also shows the start-of-semester score), then, once the markers have settled, the goals card.
   */
  function resultsView(r) {
    var box = el('div');
    var isEnd = r.id !== S.rounds[0].id, first = S.rounds[0];
    var before = {};
    if (isEnd && first.submitted) first.scores.forEach(function (x) { before[x.id] = x; });
    var hasBefore = Object.keys(before).length > 0;
    var many = (S.unit && S.unit.many || 'competencies').toLowerCase(), one = (S.unit && S.unit.one || 'competency').toLowerCase();
    var L = S.levels.length;
    box.appendChild(el('h2', { style: 'margin-top:14px', text: S.heading + ': ' + r.name.toLowerCase() }));

    var card = el('div', { class: 'card compA' }, el('h2', { text: 'Where you stand' }));
    card.appendChild(el('p', { class: 'lead', text: isEnd
      ? 'Your score in each ' + one + ' today, from your answers' + (hasBefore ? ', next to where you stood at the start of the semester.' : '.')
      : 'Your score in each ' + one + ' is the average of your answers to its questions, from 1 (' + S.levels[0] + ') to ' + L + ' (' + S.levels[L - 1] + '). There is no good or bad score: it is where you start.' }));
    var rows = el('div', { class: 'rows' });
    var marks = [];
    r.scores.forEach(function (x, k) {
      var lab = el('div', { class: 'lab' }, x.name);
      if (r.goals.indexOf(x.id) !== -1) lab.appendChild(el('span', { class: 'tag', text: isEnd ? 'goal' : 'your goal' }));
      else if (isEnd && first.goals.indexOf(x.id) !== -1) lab.appendChild(el('span', { class: 'tag prev', text: 'goal at the start' }));
      if (x.na) lab.appendChild(el('span', { class: 'sub', text: x.na + (x.na === 1 ? ' question' : ' questions') + ': ' + S.naLabel.toLowerCase() }));
      var track = el('div', { class: 'track', role: 'img', 'aria-label': x.name + ': ' + (x.score === null ? S.naLabel : f1(x.score) + ' of ' + L) });
      S.levels.forEach(function (t, i) {
        track.appendChild(el('span', { class: 'tick', style: 'left:' + pos(i + 1) }));
        track.appendChild(el('span', { class: 'tlab' + (i > 0 && i < L - 1 ? ' mid' : ''), style: 'left:' + pos(i + 1), text: (i + 1) + ' ' + t }));
      });
      var b = before[x.id];
      if (x.score === null) track.appendChild(el('span', { class: 'none', text: S.naLabel }));
      else {
        if (b && b.score !== null) {
          var lo = Math.min(b.score, x.score), hi = Math.max(b.score, x.score);
          var span = el('span', { class: 'span', style: 'left:0%; width:0%' });
          track.appendChild(span);
          track.appendChild(el('span', { class: 'mark prev', title: 'Start of semester: ' + f1(b.score) }));
          marks.push({ e: span, left: pos(lo), width: ((hi - lo) / (L - 1) * 100) + '%', k: k });
          marks.push({ e: track.lastChild, left: pos(b.score), k: k });
        }
        var m = el('span', { class: 'mark', text: f1(x.score), style: 'transition-delay:' + (k * 90) + 'ms' });
        track.appendChild(m);
        marks.push({ e: m, left: pos(x.score), k: k });
      }
      rows.appendChild(el('div', { class: 'srow' }, lab, track));
    });
    card.appendChild(rows);
    if (hasBefore) card.appendChild(el('p', { class: 'legend' }, el('i', { class: 'now' }), 'today', el('i', { class: 'was' }), 'start of the semester'));
    box.appendChild(card);
    // The first time, the markers slide from the left end to the scores once the card is on the page; later
    // redraws (a goal chosen, a save) place them at once.
    var place = function () { marks.forEach(function (m) { m.e.style.left = m.left; if (m.width) m.e.style.width = m.width; }); };
    if (animateResults) requestAnimationFrame(function () { requestAnimationFrame(place); }); else place();

    // The goals card appears after the markers have settled; at once when goals are chosen, the student was choosing,
    // or the survey is closed. (Decided before the card is drawn: drawing it in edit mode starts the draft.)
    var soon = !animateResults || r.goals.length || !r.open || goalDraft !== null || goalsSkipped;
    // The goals card is redrawn on its own as the student picks, so the scores above do not move.
    var goals = goalsCard(r, isEnd, many, one, redraw);
    function redraw() { var g = goalsCard(cur(), isEnd, many, one, redraw); g.classList.add('show'); goals.replaceWith(g); goals = g; }
    box.appendChild(goals);
    revealTimer = setTimeout(function () { goals.classList.add('show'); }, soon ? 30 : 1800);
    animateResults = false;

    box.appendChild(el('p', { class: 'after muted' }, r.open ? 'Want to look at your answers again? ' : 'This survey is closed. ',
      el('button', { class: 'link', text: r.open ? 'Review or change my answers' : 'See my answers', on: { click: function () {
        view = ''; goalDraft = null; render(); window.scrollTo(0, 0);
      } } }), '.'));
    return box;
  }

  /** The goals card: choose up to S.goalsMax sections to improve (while the round is open), or the sections chosen. redraw: redraws the card. */
  function goalsCard(r, isEnd, many, one, redraw) {
    var card = el('div', { class: 'card compB goals' });
    var max = S.goalsMax || 3;
    var editing = r.open && (goalDraft !== null || (!r.goals.length && !goalsSkipped));
    if (!editing) {
      card.appendChild(el('h2', { text: isEnd ? 'Your goals' : 'Your goals for this semester' }));
      if (r.goals.length) {
        var advice = r.advice || {};
        var tipsAt = r.goals.some(function (g) { return advice[g]; });
        card.appendChild(el('p', { class: 'lead', text: (goalsNote ? goalsNote + ' ' : '') + 'The ' + many + ' you chose to work on'
          + (tipsAt ? ', with advice on the statements you rated lowest.' : '.') }));
        S.blocks.filter(function (b) { return r.goals.indexOf(b.id) !== -1; }).forEach(function (b) { card.appendChild(goalAdvice(r, b, advice[b.id])); });
        if (r.open) card.appendChild(el('p', { style: 'margin-top:12px' }, el('button', { class: 'link', text: 'Change my goals', on: { click: function () { goalDraft = r.goals.slice(); goalsNote = ''; redraw(); } } })));
      } else if (r.open) {
        card.appendChild(el('p', { class: 'lead' }, 'You have not chosen goals yet. You can while the survey is open. ',
          el('button', { class: 'link', text: 'Choose my goals', on: { click: function () { goalsSkipped = false; goalDraft = []; redraw(); } } })));
      } else card.appendChild(el('p', { class: 'lead muted', text: 'You did not choose goals while the survey was open.' }));
      return card;
    }
    if (goalDraft === null) goalDraft = r.goals.slice();
    card.appendChild(el('h2', { text: isEnd ? 'What next?' : 'Where do you want to grow?' }));
    card.appendChild(el('p', { class: 'lead', text: isEnd
      ? 'A skill keeps improving after a class ends if you keep practicing it. Choose up to ' + max + ' ' + many + ' you want to keep working on.'
      : 'Skills improve through deliberate practice, and this semester offers many chances for it. Choose up to ' + max + ' ' + many
        + ' to focus on, and use your classes and projects to practice them. Your instructor will see your choices.' }));
    var chips = el('div', { class: 'chips', role: 'group', 'aria-label': 'Choose up to ' + max }), count, go;
    var full = function () { return goalDraft.length >= max; };
    r.scores.forEach(function (x) {
      var on = goalDraft.indexOf(x.id) !== -1;
      chips.appendChild(el('button', { type: 'button', class: 'chip' + (on ? ' on' : ''), disabled: !on && full(), 'aria-pressed': on ? 'true' : 'false', on: { click: function () {
        var i = goalDraft.indexOf(x.id);
        if (i !== -1) goalDraft.splice(i, 1); else if (!full()) goalDraft.push(x.id);
        goalsNote = ''; redraw();
      } } }, el('span', { class: 'ck', text: '✓' }), el('span', { class: 'n', text: x.name }), x.score === null ? null : el('span', { class: 'sc', text: f1(x.score) })));
    });
    card.appendChild(chips);
    var n = goalDraft.length;
    count = el('span', { class: 'count', text: n === 0 ? 'Tap up to ' + max + ' ' + many + '.' : n + ' of ' + max + ' chosen' + (n === max ? '.' : '; you can pick ' + (max - n) + ' more.') });
    go = el('button', { class: 'go brown', text: goalsBusy ? 'Saving...' : 'Save my goals', disabled: !!(goalsBusy || (!n && !r.goals.length)), on: { click: function () { saveGoals(r, redraw); } } });
    var row = el('div', { class: 'goalrow' }, count, go);
    if (r.goals.length) row.appendChild(el('button', { class: 'link', text: 'Cancel', on: { click: function () { goalDraft = null; goalsNote = ''; redraw(); } } }));
    else row.appendChild(el('button', { class: 'link', text: 'Not now', on: { click: function () { goalDraft = null; goalsNote = ''; goalsSkipped = true; redraw(); } } }));
    card.appendChild(row);
    if (goalsNote) card.appendChild(el('div', { class: 'banner err', text: goalsNote }));
    return card;
  }

  // The sentence on a statement rated at each level of the five-point confidence scale (1 to 5), and on the sixth option
  var CONFIDENCE = ['You have no confidence yet in your ability in ', 'You have little confidence in your ability in ', 'You have some confidence in your ability in ',
                    'You are mostly confident in your ability in ', 'You are fully confident in your ability in '];
  var NOT_TRIED = 'You have not yet had a chance to try ';
  var ADVICE_LEAD = 'A good way to improve it is to ';  // the instructor's advice completes this sentence
  /** A statement inside a sentence: its first letter in lower case, unless the first word is an acronym ("AI tools ..."). */
  function inSentence(s) { s = s.trim(); return /^[A-Z][A-Z]/.test(s) ? s : s.charAt(0).toLowerCase() + s.slice(1); }
  /** The sentence on the student's answer v to statement s, with the statement in bold. */
  function answerSentence(s, v) {
    var lead = v === 'na' ? NOT_TRIED : S.levels.length === 5 ? CONFIDENCE[Number(v) - 1] : null;
    if (lead) return el('p', { class: 'stmt' }, lead, el('b', { text: inSentence(s).replace(/\.$/, '') }), '.');
    return el('p', { class: 'stmt' }, 'You rated ', el('b', { text: s.trim().replace(/\.$/, '') }), ' as "' + S.levels[Number(v) - 1] + '".');
  }

  /**
   * One chosen goal: the section's name, then the advice of the statements the Worker picked (a: {ids, high};
   * ids lowest-rated first), each as a sentence on the student's answer and the advice after "A good way to improve it is to".
   * high: every statement was rated above the middle of the scale.
   */
  function goalAdvice(r, b, a) {
    var box = el('div', { class: 'goal' }, el('h3', { text: b.name }));
    if (!a || !a.ids.length) return box;
    var L = S.levels.length;
    if (a.high) box.appendChild(el('p', { class: 'why', text: 'You rated every statement here ' + (Math.ceil(L / 2) + 1) + ' or higher. The one you rated lowest:' }));
    a.ids.forEach(function (id) {
      var i = b.items.filter(function (q) { return q.id === id; })[0];
      if (!i) return;
      var v = r.answers[id];
      box.appendChild(el('div', { class: 'tip' }, answerSentence(i.text, v), el('p', { class: 'adv', text: ADVICE_LEAD + i.advice.trim() })));
    });
    return box;
  }

  /** Saves the chosen goals; the whole results page is then redrawn (the goal tags beside the scores change), without the slide. */
  function saveGoals(r, redraw) {
    if (goalsBusy) return;
    goalsBusy = true; goalsNote = ''; redraw();
    var chosen = goalDraft.slice();
    api('goals', [r.id, chosen]).then(function (s) {
      goalsBusy = false; S = s; goalDraft = null;
      goalsNote = chosen.length ? 'Saved.' : '';
      done = ''; render();
    }).catch(function (e) {
      goalsBusy = false;
      if (e.message === 'SIGNIN') return;
      goalsNote = e.message; redraw();
      if (/closed/.test(e.message)) load();
    });
  }

  function renderBar() {
    var bar = document.getElementById('bar'), r = cur();
    if (!r || !r.open || !S.authorized) { bar.hidden = true; return; }
    var n = answered(), total = items().length;
    var state = saveError ? saveError
      : saving ? 'Saving...'
      : r.submitted ? (dirty ? 'Changes not submitted yet.' : 'Submitted ' + when(r.submitted) + '.')
      : dirty ? 'Not saved yet...'
      : savedAt ? 'Saved ' + clockOf(savedAt) + '.' : '';
    if (showMissing && n < total) state = (total - n) + ' not answered: tap a red circle to find ' + (total - n === 1 ? 'it.' : 'them.');
    // One circle per item, competencies separated by a small gap.
    var dots = el('div', { class: 'dots', role: 'group', 'aria-label': n + ' of ' + total + ' answered' });
    S.blocks.forEach(function (c) {
      c.items.forEach(function (d, k) {
        var id = d.id, done = has(d);
        dots.appendChild(el('button', { type: 'button', title: d.name + (done ? '' : ' (not answered)'), 'aria-label': d.name + (done ? ', answered' : ', not answered'),
          class: 'dot' + (k === 0 ? ' first' : '') + (done ? ' on' : showMissing ? ' miss' : ''),
          on: { click: function () { var e = document.getElementById('item-' + id); if (e) e.scrollIntoView({ behavior: 'smooth', block: 'center' }); } } }));
      });
    });
    bar.hidden = false;
    bar.innerHTML = '';
    bar.appendChild(el('div', { class: 'in' }, dots,
      el('span', { class: 'state', style: saveError || (showMissing && n < total) ? 'color:var(--warn)' : '', text: state }),
      el('button', { class: 'go', text: r.submitted ? 'Submit changes' : 'Submit', disabled: !!(saving || (r.submitted && !dirty)), on: { click: submit } })));
  }

  boot();
</script>
</body>
</html>
