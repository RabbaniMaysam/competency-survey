<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Competency survey: instructor page</title>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="config.js"></script>
  <style>
    :root { --ink: #1f2328; --muted: #5c6670; --line: #d8dde3; --bg: #f6f7f9; --card: #fff;
            --accent: #0b5cad; --ok: #1a7f37; --warn: #b3261e; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 17px; margin: 0 0 10px; }
    h3 { font-size: 15px; margin: 14px 0 6px; }
    p { margin: 0 0 10px; }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-top: 14px; }
    .banner { padding: 9px 14px; border-radius: 8px; margin-top: 12px; }
    .banner.err { background: #fdecea; color: var(--warn); border: 1px solid #f3c1bc; }
    .banner.ok { background: #e8f5ec; color: var(--ok); border: 1px solid #b9dfc4; }
    .banner.note { background: #fff4d6; color: #6b4e00; border: 1px solid #ecd58f; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; vertical-align: top; padding: 6px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
    th { border-top: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; }
    tr.gone td { color: var(--muted); }
    tr.detail td { background: #f8fafc; white-space: normal; }
    .round { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 10px; }
    .round.open { border-color: var(--ok); background: #f3faf5; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
    .pill.open { background: #dff3e4; color: var(--ok); }
    .pill.closed { background: #eceff2; color: var(--muted); }
    button { font: inherit; padding: 4px 11px; border-radius: 6px; border: 1px solid var(--accent);
             background: var(--accent); color: #fff; cursor: pointer; }
    button.plain { background: #fff; color: var(--accent); }
    button.danger { background: #fff; color: var(--warn); border-color: var(--warn); }
    button.link { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; }
    button.tab { background: #fff; color: var(--ink); border-color: var(--line); }
    button.tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    input, select, textarea { font: inherit; padding: 4px 7px; border: 1px solid var(--line); border-radius: 6px; max-width: 100%; }
    label { display: inline-flex; align-items: center; gap: 6px; }
    label.comp { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; }
    label.comp input { margin-top: 3px; }
    code { background: #eef1f4; padding: 1px 5px; border-radius: 4px; }
    .veil { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: center;
            justify-content: center; padding: 16px; z-index: 10; }
    .modal { background: #fff; border-radius: 10px; padding: 20px; width: 100%; max-width: 480px;
             box-shadow: 0 10px 40px rgba(0, 0, 0, .3); }
    .modal h2 { margin-bottom: 8px; }
    .modal p { margin: 0 0 8px; }
    .modal .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    button.danger.solid { background: var(--warn); color: #fff; }
    .qrveil { background: #fff; flex-direction: column; cursor: pointer; text-align: center; }
    .qrveil h1 { font-size: 34px; margin: 0 0 12px; }
    .qr { width: min(70vh, 90vw); height: min(70vh, 90vw); }
    .qr svg { width: 100%; height: 100%; display: block; }
    .qrurl { font-size: 26px; margin: 14px 0 4px; word-break: break-all; }
    .qrstatus { font-size: 22px; margin: 0 0 6px; color: var(--ok); }
    .qrcode { font-size: 44px; font-weight: 700; margin: 6px 0; letter-spacing: 4px; }
    .qrcode small { font-size: 22px; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-right: 12px; }
    /* the bar beside the session code: full when a new code appears, empty when it changes (the class's interval, 30 seconds by default) */
    .codebar { display: inline-block; width: 140px; height: 14px; margin-left: 16px; vertical-align: middle; border-radius: 7px; background: #e3e7ec; overflow: hidden; }
    .codebar div { height: 100%; background: var(--accent); border-radius: 7px; }
    /* the Report tab: a title block, summary figures in boxes, figures with captions, and tables with group rows */
    .report .rhead h2 { font-size: 20px; margin: 6px 0 2px; }
    .report .rhead .sub { font-size: 16px; margin: 0 0 4px; }
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 10px 0 16px; }
    .fact { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #f8fafc; }
    .fact b { display: block; font-size: 21px; font-weight: 700; white-space: nowrap; }
    .fact span { color: var(--muted); font-size: 12px; }
    .figure { margin: 12px 0 18px; break-inside: avoid; }
    .figure svg { max-width: 100%; height: auto; display: block; }
    .figure p { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
    .report h2.sec { margin-top: 20px; }
    .report table { width: auto; }
    .report tr.group td { font-weight: 700; padding-top: 12px; }
    .report tr.total td { font-weight: 700; border-top: 2px solid var(--ink); }
    .report td.lab { padding-left: 18px; }
    /* the Questions tab: a box per section, a row per question (number, statement and its options, answer count) */
    button.small { padding: 1px 8px; font-size: 13px; }
    .qsec { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 12px; background: #fbfbfc; }
    .qsec > .row b { white-space: nowrap; }
    .qitem { display: flex; gap: 8px; padding: 8px 0; border-top: 1px dashed var(--line); }
    .qitem:first-of-type { border-top: 0; }
    .qnum { min-width: 24px; padding-top: 5px; color: var(--muted); font-weight: 600; }
    .qbody { flex: 1; min-width: 0; }
    .qbody textarea { width: 100%; resize: vertical; }
    .qtexts { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
    .qtexts summary { cursor: pointer; }
    .qgrid { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 6px 10px; align-items: start; margin-top: 8px; }
    .qgrid > span { padding-top: 5px; }
    .qgrid textarea, .qgrid input { width: 100%; }
    @media (max-width: 600px) { .qgrid { grid-template-columns: 1fr; } .qgrid > span { padding-top: 6px; } }
  </style>
</head>
<body>
<main>
  <div id="app"><p class="muted">Loading...</p></div>
  <div id="signin" hidden></div>
</main>
<script>
  var API = (window.SURVEY_API || '').replace(/\/+$/, '');
  var TOKEN_KEY = 'survey_admin_token';  // this tool's own key: other tools' pages share the origin and keep their own tokens
  var TZ = 'America/New_York';
  var TABS = ['Overview', 'Questions', 'QR code', 'Responses', 'Report', 'Settings', 'Roster', 'Log'];
  var token = '', me = '', classes = [], cur = '', D = null, tab = 'Overview';
  var flash = null, busy = false, timer = null, openRow = '';
  var rosterSel = {};  // emails ticked on the Roster tab for removal at once
  // survey_admin.html?qr=KEY is the QR screen of that class in its own tab (for the projector); see qrPage.
  var qrMode = new URLSearchParams(location.search).get('qr') || '';
  // The token is kept in localStorage: the Worker's session token (sent after a Google sign-in) lasts months. "Sign out" deletes it.
  try { token = localStorage.getItem(TOKEN_KEY) || ''; cur = qrMode || new URLSearchParams(location.search).get('c') || sessionStorage.getItem('survey_admin_class') || ''; } catch (e) {}

  // ---------------------------------------------------------------- plumbing

  function el(tag, attrs) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'value') e.value = attrs[k];
      else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { e.addEventListener(ev, attrs.on[ev]); });
      else if (attrs[k] !== false && attrs[k] !== null) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid === null || kid === undefined || kid === false) continue;
      e.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    }
    return e;
  }

  function setToken(t) {
    token = t || '';
    try { token ? localStorage.setItem(TOKEN_KEY, token) : localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }

  function setClass(key) {
    cur = key || ''; D = null; settingsDraft = null; qDraft = null; logRows = null; openRow = ''; reportData = null; rosterSel = {};
    try { sessionStorage.setItem('survey_admin_class', cur); } catch (e) {}
  }

  // Every "get" response carries the server's clock; the session codes are computed on the server's time, not the PC's.
  var clockOffset = 0;
  function setD(d) { D = d; if (d && d.now) clockOffset = Date.parse(d.now) - Date.now(); }
  function serverNow() { return Date.now() + clockOffset; }

  // The session code: a copy of sessionCode in worker/src/survey.js (cyrb53 hash of the class's secret and the slot,
  // the server clock divided by the class's interval: codeSec seconds, set on the Settings tab, 30 by default).
  function codeSec() { return D && D.state.codeSec > 0 ? D.state.codeSec : 30; }
  function sessionCode(secret, slot) {
    var str = String(secret || '') + '|' + slot, h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (var i = 0; i < str.length; i++) {
      var ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    var n = 4294967296 * (2097151 & h2) + (h1 >>> 0);
    return String(n % 10000).padStart(4, '0');
  }

  function call(action, args, key) {
    return fetch(API + '/admin', { method: 'POST',
      body: JSON.stringify({ token: token, class: key === undefined ? cur : key, action: action, args: args || [] }) })
      .then(function (r) { return r.json(); })
      .then(function (out) {
        if (out.session) setToken(out.session);
        if (out.ok) return out.data;
        if (out.error === 'SIGNIN') { var why = token.indexOf('s1.') === 0 ? 'session' : 'google'; setToken(''); showSignIn(why); throw new Error('SIGNIN'); }
        throw new Error(out.error);
      });
  }

  function fail(e) {
    busy = false;
    if (e.message === 'SIGNIN') return;
    flash = { err: e.message }; render();
  }

  /** Runs one instructor action on the current class and redraws. */
  function run(action, args, okText) {
    busy = true; flash = null; render();
    call(action, args).then(function (d) {
      busy = false; setD(d); flash = okText ? { ok: okText } : null; reportData = null;
      render();
      if (action === 'saveSettings') refreshClasses();
    }).catch(fail);
  }

  function refreshClasses() {
    call('whoami', [], '').then(function (d) { classes = d.classes; render(); }).catch(function () {});
  }

  function loadClass(quiet) {
    if (!cur) { render(); return; }
    call('get').then(function (d) {
      setD(d);
      // A quiet refresh leaves a form the instructor is typing in alone.
      var a = document.activeElement, typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox';
      if (!busy && !(quiet && typing)) render();
    }).catch(function (e) { if (!quiet) fail(e); });
  }

  // The Overview, Responses, and Report tabs refresh every 30 seconds, so new submissions appear; the QR code tab
  // and the QR screen every 10 seconds, for their submission count.
  function poll() {
    clearTimeout(timer);
    var qr = qrMode || tab === 'QR code';
    timer = setTimeout(function () {
      if (cur && !document.hidden && (qr || tab === 'Overview' || tab === 'Responses')) loadClass(true);
      if (cur && !document.hidden && tab === 'Report' && !busy) loadReport(true);
      poll();
    }, qr ? 10000 : 30000);
  }

  function start() {
    call('whoami', [], '').then(function (d) {
      me = d.email; classes = d.classes;
      if (!classes.some(function (c) { return c.key === cur; })) setClass(classes.length ? classes[0].key : '');
      loadClass(false); poll();
    }).catch(function (e) {
      if (e.message === 'SIGNIN') return;
      var app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(el('div', { class: 'banner err', text: e.message }));
      app.appendChild(el('p', {}, el('button', { class: 'link', text: 'Sign out', on: { click: signOut } })));
    });
  }

  // ---------------------------------------------------------------- sign-in

  function whenGoogleReady(fn) {
    if (window.google && google.accounts && google.accounts.id) fn();
    else setTimeout(function () { whenGoogleReady(fn); }, 100);
  }

  // Why the sign-in screen is shown, for diagnosing a sign-in that does not persist.
  var SIGNIN_WHY = {
    none: 'Why this screen: this browser had no saved sign-in (a first visit in this browser or profile, a private window, or a browser that deletes site data).',
    google: 'Why this screen: the saved sign-in was Google\'s one-hour sign-in and it expired.',
    session: 'Why this screen: the server refused the saved 180-day sign-in.'
  };

  function showSignIn(why) {
    var app = document.getElementById('app'), box = document.getElementById('signin');
    app.innerHTML = '';
    app.appendChild(el('h1', { text: 'Competency survey: instructor page' }));
    app.appendChild(el('p', { class: 'muted', text: 'Sign in with an instructor account.' }));
    if (SIGNIN_WHY[why]) app.appendChild(el('p', { class: 'muted', text: SIGNIN_WHY[why] }));
    box.hidden = false; box.innerHTML = '';
    whenGoogleReady(function () { google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', text: 'signin_with' }); });
  }

  function signOut() {
    leaveEdits().then(function (go) {
      if (!go) return;
      setToken(''); D = null; settingsDraft = null; qDraft = null;
      whenGoogleReady(function () { google.accounts.id.disableAutoSelect(); });
      showSignIn();
    });
  }

  function boot() {
    var app = document.getElementById('app');
    fetch(API + '/config').then(function (r) { return r.json(); }).then(function (c) {
      whenGoogleReady(function () {
        google.accounts.id.initialize({ client_id: c.clientId, callback: function (resp) {
          setToken(resp.credential);
          document.getElementById('signin').hidden = true;
          start();
        } });
      });
      if (token) start(); else showSignIn('none');
    }).catch(function () {
      app.innerHTML = '';
      app.appendChild(el('div', { class: 'banner err', text: 'The survey service did not respond. Reload the page in a minute.' }));
    });
  }

  // ---------------------------------------------------------------- helpers

  function isoClock(iso) { return new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(new Date(iso)); }
  function isoFull(iso) { return new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit' }).format(new Date(iso)); }
  function today() { return new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date()); }
  function fullName(r) { return (r.first + ' ' + r.last).trim(); }
  function studentLink() { return location.href.replace(/survey_admin\.html.*$/, '') + 'survey.html?c=' + encodeURIComponent(cur); }
  function button(label, cls, fn) { return el('button', { text: label, class: cls, disabled: busy, on: { click: fn } }); }
  function survey() { return D.state.survey; }
  /** What a section is called: {one, many} (the Questions tab's texts; "Competency" by default). */
  function unit() { return survey().unit; }
  /** Whether a question is in the class's survey (D.items lists the survey's questions, then the removed ones). */
  function inSurvey(i) { return !i.retired; }
  function activeItems() { return D.items.filter(inSurvey); }
  function responsesOf(round) { return D.responses.filter(function (x) { return x.round === round; }); }
  /** A level counts as an answer; the sixth option ('na') counts when the question offers it. */
  function answeredCount(x) { return activeItems().filter(function (i) { return i.id in x.answers && (x.answers[i.id] !== 'na' || i.na); }).length; }
  function levelText(v) { return v === 'na' ? survey().naLabel : v ? v + ' ' + (survey().levels[v - 1] || '') : ''; }
  /** A value for a datetime-local input: the given time in this computer's time zone. */
  function localInput(ms) { var d = new Date(ms - new Date(ms).getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); }

  function download(name, rows) {
    var csv = rows.map(function (r) {
      return r.map(function (v) { return '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
    var a = el('a', { href: URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })), download: name });
    document.body.appendChild(a); a.click(); a.remove();
  }

  /** A dialog with the given buttons [{label, value, cls}]; resolves the chosen value, or null on Cancel, Esc, or a click outside. */
  function choose(title, lines, buttons) {
    return new Promise(function (resolve) {
      var veil;
      var done = function (v) { veil.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
      var onKey = function (ev) { if (ev.key === 'Escape') done(null); };
      var box = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' }, el('h2', { text: title }));
      lines.forEach(function (l) { box.appendChild(el('p', { text: l })); });
      var row = el('div', { class: 'buttons' }, el('button', { class: 'plain', text: 'Cancel', on: { click: function () { done(null); } } }));
      var first = null;
      buttons.forEach(function (b) {
        var btn = el('button', { text: b.label, class: b.cls || '', on: { click: function () { done(b.value); } } });
        row.appendChild(btn); first = first || btn;
      });
      box.appendChild(row);
      veil = el('div', { class: 'veil', on: { click: function (ev) { if (ev.target === veil) done(null); } } }, box);
      document.body.appendChild(veil);
      document.addEventListener('keydown', onKey);
      first.focus();
    });
  }

  function ask(title, lines, okLabel, danger) {
    return choose(title, lines, [{ label: okLabel, value: true, cls: danger ? 'danger solid' : '' }]).then(function (v) { return v === true; });
  }

  /** A dialog whose button works only once the class key is typed exactly. Resolves the typed key, or null on Cancel, Esc, or a click outside. */
  function confirmKey(title, lines, key, okLabel) {
    return new Promise(function (resolve) {
      var veil;
      var done = function (v) { veil.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
      var onKey = function (ev) { if (ev.key === 'Escape') done(null); };
      var box = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' }, el('h2', { text: title }));
      lines.forEach(function (l) { box.appendChild(el('p', { text: l })); });
      var go = el('button', { class: 'danger solid', text: okLabel, disabled: true, on: { click: function () { done(inp.value.trim()); } } });
      var inp = el('input', { type: 'text', placeholder: key, autocomplete: 'off', style: 'width:100%; box-sizing:border-box', on: {
        input: function () { go.disabled = inp.value.trim() !== key; },
        keydown: function (ev) { if (ev.key === 'Enter' && !go.disabled) done(inp.value.trim()); } } });
      box.appendChild(el('p', {}, el('b', { text: 'Type the class key ' + key + ' to confirm:' })));
      box.appendChild(inp);
      box.appendChild(el('div', { class: 'buttons' }, el('button', { class: 'plain', text: 'Cancel', on: { click: function () { done(null); } } }), go));
      veil = el('div', { class: 'veil', on: { click: function (ev) { if (ev.target === veil) done(null); } } }, box);
      document.body.appendChild(veil);
      document.addEventListener('keydown', onKey);
      inp.focus();
    });
  }

  /**
   * The roster import dialog. p is the Worker's previewRoster answer: the file's student count, how many are on the
   * roster, the new students, and the students on the roster but not in the file, each listed with a checkbox
   * (checked keeps the student, unchecked drops). Resolves the emails to keep, or null on Cancel, Esc, or a click outside.
   */
  function importChoice(p, dropNote) {
    return new Promise(function (resolve) {
      var veil;
      var done = function (v) { veil.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
      var onKey = function (ev) { if (ev.key === 'Escape') done(null); };
      var nm = function (r) { return (r.first + ' ' + r.last).trim() || r.email; };
      var box = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', style: 'max-width:560px' }, el('h2', { text: 'Import the roster' }));
      box.appendChild(el('p', { text: 'The file has ' + p.file + ' student' + (p.file === 1 ? '' : 's') + ': ' + p.matched + ' on the roster now, ' + p.added.length + ' new.' }));
      if (p.added.length) box.appendChild(el('p', { class: 'muted', text: 'New: ' + p.added.map(nm).join(', ') + '.' }));
      var go = el('button', { text: 'Import' });
      var boxes = p.missing.map(function (r) {
        var cb = el('input', { type: 'checkbox', on: { change: function () { label(); } } }); cb.checked = true;
        return { r: r, cb: cb };
      });
      var label = function () {
        var n = boxes.filter(function (b) { return !b.cb.checked; }).length;
        go.textContent = n ? 'Import and drop ' + n : 'Import';
        go.className = n ? 'danger solid' : '';
      };
      if (boxes.length) {
        box.appendChild(el('p', {}, el('b', { text: boxes.length + (boxes.length === 1 ? ' student on the roster is' : ' students on the roster are') + ' not in the file.' }),
          ' Checked students stay on the roster; unchecked students are dropped. ' + dropNote));
        var all = function (v) { return function () { boxes.forEach(function (b) { b.cb.checked = v; }); label(); }; };
        box.appendChild(el('div', { style: 'display:flex; gap:8px; margin-bottom:6px' },

      var total = b.total && ri === b.rows.length - 1;
      body.push(keep.map(function (k) {
        var st = { halign: align(k) };
        if (total) { st.fontStyle = 'bold'; st.lineWidth = { top: 1 }; st.lineColor = ink; }
        if (b.group >= 0 && k === b.group + 1) st.cellPadding = { top: 3, bottom: 3, left: 14, right: 4 };
        return { content: cellText(r[k]), styles: st };
      }));
    });
    doc.autoTable({ startY: y, margin: { left: M, right: M, top: M, bottom: M }, theme: 'plain', rowPageBreak: 'avoid',
      head: [keep.map(function (k) { return { content: b.head[k], styles: { halign: align(k) } }; })], body: body,
      styles: { font: 'helvetica', fontSize: 8.5, cellPadding: { top: 3, bottom: 3, left: 4, right: 4 }, textColor: ink, lineColor: [227, 231, 236], lineWidth: { bottom: 0.5 } },
      headStyles: { fillColor: [236, 238, 241], fontStyle: 'bold', lineWidth: 0 } });

  /** The Word file: the same blocks, figures as pictures. */
  function reportWord() {
    var m = reportModelNow;
    if (!m) return;
    busy = true; flash = null; render();
    withLib('docx', function () {
      var d = window.docx;
      figurePngs(m).then(function (pngs) {
        var kids = [], fi = 0;
        var para = function (text, opts) { return new d.Paragraph(Object.assign({ children: [new d.TextRun({ text: text })], spacing: { after: 120 } }, opts || {})); };
        m.blocks.forEach(function (b) {
          if (b.xlsxOnly) return;

            kids.push(new d.Paragraph({ text: b.title, heading: d.HeadingLevel.TITLE }));
            kids.push(new d.Paragraph({ text: b.sub, heading: d.HeadingLevel.HEADING_1 }));
            kids.push(para(b.meta, { spacing: { after: 240 } }));
          } else if (b.t === 'facts') {
            b.items.forEach(function (i) { kids.push(new d.Paragraph({ children: [new d.TextRun({ text: i.v, bold: true }), new d.TextRun({ text: '  ' + i.l })], spacing: { after: 60 } })); });
            kids.push(para(''));
          } else if (b.t === 'h2') kids.push(new d.Paragraph({ text: b.text, heading: d.HeadingLevel.HEADING_2 }));
          else if (b.t === 'p') kids.push(para(b.text));
          else if (b.t === 'figure') {
            var png = pngs[fi++], w = 620;
            kids.push(new d.Paragraph({ children: [new d.ImageRun({ type: 'png', data: png.data, transformation: { width: w, height: Math.round(png.h * w / png.w) } })], spacing: { before: 120 } }));
            kids.push(new d.Paragraph({ children: [new d.TextRun({ text: b.caption, italics: true, size: 18 })], spacing: { after: 240 } }));
          } else if (b.t === 'table') { kids.push(docxTable(d, b)); kids.push(para('')); }
        });
        var footer = new d.Footer({ children: [new d.Paragraph({ alignment: d.AlignmentType.RIGHT, children: [new d.TextRun({ children: ['Page ', d.PageNumber.CURRENT, ' of ', d.PageNumber.TOTAL_PAGES], size: 16, color: '5c6670' })] })] });
        var doc = new d.Document({ creator: 'Competency survey', title: m.title + ': ' + m.sub,
          styles: { default: { document: { run: { font: 'Calibri', size: 21 } } } },
          sections: [{ properties: { page: { margin: { top: 1080, right: 1080, bottom: 1080, left: 1080 } } }, footers: { default: footer }, children: kids }] });

  }
  function docxTable(d, b) {
    var keep = b.head.map(function (h, k) { return k; }).filter(function (k) { return k !== b.group; });
    // column widths (twentieths of a point over the 7 in text width) in proportion to the longest text of each column
    var TOTAL = 10080, lens = keep.map(function (k) {
      var headWord = b.head[k].split(' ').reduce(function (w, s) { return Math.max(w, s.length); }, 0);
      var longest = b.rows.reduce(function (w, r) { return Math.max(w, cellText(r[k]).length); }, headWord);
      return Math.max(8, Math.min(30, longest + 2));
    });
    var sumLen = lens.reduce(sum, 0), widths = lens.map(function (l) { return Math.round(TOTAL * l / sumLen); });
    var edge = { style: d.BorderStyle.SINGLE, size: 4, color: 'd7dde3' };
    var cell = function (s, o) {
      return new d.TableCell({ columnSpan: o.span, width: { size: o.width, type: d.WidthType.DXA }, margins: { top: 40, bottom: 40, left: 80, right: 80 },
        shading: o.head ? { fill: 'eceef1', type: d.ShadingType.CLEAR } : undefined,
        children: [new d.Paragraph({ alignment: o.right ? d.AlignmentType.RIGHT : d.AlignmentType.LEFT, children: [new d.TextRun({ text: s, bold: !!o.bold, size: 17 })] })] });
    };
    var rows = [new d.TableRow({ tableHeader: true, children: keep.map(function (k, j) { return cell(b.head[k], { bold: true, head: true, right: isNum(b, k), width: widths[j] }); }) })], last = null;
    b.rows.forEach(function (r, ri) {
      if (b.group >= 0 && r[b.group] !== last) { last = r[b.group]; rows.push(new d.TableRow({ children: [cell(last, { bold: true, span: keep.length, width: TOTAL })] })); }
      var bold = b.total && ri === b.rows.length - 1;
      rows.push(new d.TableRow({ children: keep.map(function (k, j) { return cell((b.group >= 0 && k === b.group + 1 ? '   ' : '') + cellText(r[k]), { bold: bold, right: isNum(b, k), width: widths[j] }); }) }));
    });
    return new d.Table({ width: { size: TOTAL, type: d.WidthType.DXA }, columnWidths: widths, layout: d.TableLayoutType.FIXED, rows: rows,
      borders: { top: edge, bottom: edge, left: edge, right: edge, insideHorizontal: edge, insideVertical: edge } });
  }

  // ---- Settings: title, session code, full download, delete (the questions are on the Questions tab)
  function settings(card) {

    var edited = function () { settingsDraft = form(); note.textContent = settingsDirty() ? 'Unsaved changes.' : ''; };
    title.addEventListener('input', edited);
    codeCb.addEventListener('change', edited);
    codeSecIn.addEventListener('input', edited);

    card.appendChild(el('h2', { text: 'Class' }));
    card.appendChild(el('div', { class: 'row' }, el('label', {}, 'Title ', title)));
    card.appendChild(el('label', { class: 'comp', style: 'margin-top:12px' }, codeCb, el('span', {}, el('b', { text: 'Students type the session code to start a survey' }), el('br'),

    card.appendChild(el('div', { class: 'row' }, el('label', {}, 'The session code changes every ', codeSecIn, ' seconds'),
      el('span', { class: 'muted', text: '3 to 300; 30 by default' })));
    card.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, button('Save', '', function () {
      edited();

      // The confirmation lists what changes.

      });
    }), button('Discard', 'plain', function () { settingsDraft = null; render(); }), note));
    edited();

    card.appendChild(el('h2', { text: 'Download everything', style: 'margin-top:18px' }));
    card.appendChild(el('div', { class: 'row' }, button('Download JSON', 'plain', exportAll),
      el('span', { class: 'muted', text: 'One file with the settings, roster, every answer, and the whole log. The server is also backed up daily.' })));

    card.appendChild(el('h2', { text: 'Delete this class', style: 'margin-top:18px' }));
    card.appendChild(el('p', { class: 'muted', text: 'Deletes the roster, settings, every answer, and the log of this class. Download the JSON above first. Two confirmations follow, the second asks for the class key.' }));
    card.appendChild(button('Delete class', 'danger', function () {
      busy = true; flash = null; render();
      var key = cur;
      call('deleteInfo').then(function (i) {
        busy = false; render();
        var n = function (k, one, many) { return k + ' ' + (k === 1 ? one : many); };
        var lines = ['Deleting ' + key + ' (' + i.title + ') removes permanently:',
          n(i.roster, 'student', 'students') + ' on the roster.',
          n(i.responses, 'student\'s answers', 'students\' answers') + ' across the rounds, ' + i.submitted + ' of them submitted.',
          n(i.log, 'log entry', 'log entries') + '.',
          'Students can no longer answer in this class. This cannot be undone.'];
        return ask('Delete ' + key + '? (step 1 of 2)', lines, 'Continue', true).then(function (yes) {
          if (!yes) return null;
          return confirmKey('Delete ' + key + '? (step 2 of 2)', ['Everything listed is deleted now and cannot be recovered from this page.'], key, 'Delete class permanently');
        }).then(function (typed) {

          busy = true; render();
          return call('deleteClass', [typed], key).then(function (d) {
            busy = false; classes = d.classes; settingsDraft = null; setClass(classes.length ? classes[0].key : ''); flash = { ok: 'Class ' + key + ' deleted.' }; loadClass(false);

  // ---- Roster
  function roster(card) {

    var file = el('input', { type: 'file', accept: '.csv,text/csv' });
    card.appendChild(el('p', { class: 'muted', text: 'The Canvas gradebook export ("Student" as "Last, First" and "SIS Login ID"; the Points Possible row and the test student are skipped), or a CSV with first name, last name, and email columns. Addresses at mail.montclair.edu are stored as montclair.edu; students may sign in with either. Before importing, a dialog lists the students on the roster who are not in the file, to keep or drop each; answers of dropped students are kept and listed on the Responses tab as not on the roster.' }));
    card.appendChild(el('div', { class: 'row' }, file, button('Import', '', function () {

    var aFirst = el('input', { type: 'text', placeholder: 'first name', size: 14 }), aLast = el('input', { type: 'text', placeholder: 'last name', size: 14 });

    var selected = function () { return S.roster.filter(function (r) { return rosterSel[r.email]; }); };
    var rmBtn = el('button', { class: 'danger', on: { click: function () {
      var sel = selected(), k = sel.length;

      var shown = names.slice(0, 12).join(', ') + (k > 12 ? ', and ' + (k - 12) + ' more' : '');
      ask('Remove ' + k + ' student' + (k === 1 ? '' : 's') + ' from the class?', [shown + '.',

      button('Select all', 'plain', setAll(true)), button('Select none', 'plain', setAll(false)), rmBtn));
    var t = el('table', {}, el('tr', {}, el('th', {}), el('th', { text: 'Last name' }), el('th', { text: 'First name' }), el('th', { text: 'Email' }), el('th', {})));

        el('td', {}, button('Remove', 'danger', function () {

            .then(function (yes) { if (yes) run('removeStudent', [r.email], fullName(r) + ' removed.'); });

  }

  // ---- Log: students' starts and submissions, every instructor action, and every refused attempt

      }) : null));
